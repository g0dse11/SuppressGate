name: SuppressGate Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install SuppressGate
        run: python -m pip install -e .

      - name: Run automated tests
        run: python -m unittest discover -s tests -v