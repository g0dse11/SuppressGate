name: SuppressGate PR Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review new suppressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install SuppressGate
        run: python -m pip install -e .

      - name: Check pull-request suppressions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -m suppressgate check --base "$BASE_SHA"